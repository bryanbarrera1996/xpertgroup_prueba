name: LocalStack Terraform Plan

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: s3,ec2,iam,sts
          DEBUG: 1

    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Wait for LocalStack
        run: |
          for i in {1..20}; do
            curl -sf http://localhost:4566/_localstack/health && exit 0
            sleep 5
          done
          exit 1

      - name: Terraform Init
        run: |
          cd terraform
          terraform init \
            -backend=false

      - name: Terraform Plan (LocalStack)
        run: |
          cd terraform
          terraform plan \
            -var="aws_endpoint=http://localhost:4566"