name: Deployment Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  static-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build, test & Sonar analysis (with Quality Gate)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=bryanbarrera1996_xpertgroup_test \
            -Dsonar.organization=bryanbarrera1996 \
            -Dsonar.qualitygate.wait=true
          
  terraform-plan:
    runs-on: ubuntu-latest
    needs: static-analysis  
    if: success()
    env: 
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      AWS_EC2_METADATA_DISABLED: "true"
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: s3,ec2,iam,sts
          DEBUG: 1
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Wait for LocalStack
        run: |
          for i in {1..20}; do
            curl -sf http://localhost:4566/_localstack/health && exit 0
            sleep 5
          done
          exit 1

      - name: Terraform Init
        run: |
          cd terraform/environments/dev
          terraform init \
            -backend=false

      - name: Terraform Plan (LocalStack)
        run: |
          cd terraform/environments/dev
          terraform plan 
