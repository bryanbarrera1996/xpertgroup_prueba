name: Deployment Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install git-secrets
        run: |
          git clone https://github.com/awslabs/git-secrets.git
          cd git-secrets
          sudo make install
          cd ..

      - name: Setup git-secrets
        run: |
          git secrets --install
          git secrets --register-aws

      - name: Scan repo for secrets
        run: git secrets --scan

  static-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build, test & Sonar analysis (with Quality Gate)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=bryanbarrera1996_xpertgroup_test \
            -Dsonar.organization=bryanbarrera1996 \
            -Dsonar.qualitygate.wait=true    

  build-jar:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
  terraform-plan:
    runs-on: ubuntu-latest
    needs: static-analysis  
    if: success()
    env: 
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      AWS_EC2_METADATA_DISABLED: "true"
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: s3,ec2,iam,sts
          DEBUG: 1
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Wait for LocalStack
        run: |
          for i in {1..20}; do
            curl -sf http://localhost:4566/_localstack/health && exit 0
            sleep 5
          done
          exit 1

      - name: Terraform Init
        run: |
          cd terraform/environments/dev
          terraform init \
            -backend=false

      - name: Terraform Plan (LocalStack)
        run: |
          cd terraform/environments/dev
          terraform plan 
  k8s-simulation:
    name: Kubernetes Simulation (kind)
    runs-on: ubuntu-latest
    needs: [build-jar, terraform-plan]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ./target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t numeric-app:local .

      - name: Install kind
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Create Kubernetes cluster
        run: |
          kind create cluster --name xpertgroup-cluster

      - name: Load image into kind
        run: |
          kind load docker-image numeric-app:local --name xpertgroup-cluster

      - name: Deploy application
        run: |
          kubectl create deployment numeric --image=numeric-app:local
          kubectl expose deployment numeric --port=8080 --type=ClusterIP

      - name: Verify pods
        run: |
          kubectl get pods
          kubectl get svc

      - name: Wait for pod to be created
        run: |
          for i in {1..12}; do
            kubectl get pods -l app=numeric && break
            echo "Waiting for pod to be created..."
            sleep 5
          done
      
      - name: Wait for pod to be ready
        run: |
            kubectl wait --for=condition=ready pod -l app=numeric --timeout=60s  